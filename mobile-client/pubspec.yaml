
name: mahd_app
description: مهد — تطبيق مراقبة صوتية ذكية للأطفال
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_core_web: ^3.11.0   # ← explicit: fixes 'flutter_web_plugins' resolve error on web

  # UI / Charts
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fl_chart: ^0.69.2
  cloud_firestore: ^6.10.0
  record: ^7.1.2
  flutter_foreground_task: 9.2.2
  shared_preferences: ^2.5.6
  pdf: ^3.13.1
  printing: ^5.15.1

  # GP1 Local Notifications (no FCM required)
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1

  # Cry Cause Classification
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/mahd_child_content_ar.json
    - assets/models/
