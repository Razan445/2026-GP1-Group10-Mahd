name: mahd_app
description: مهد — تطبيق مراقبة صوتية ذكية للأطفال
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_core_web: ^3.11.0   # ← explicit: fixes 'flutter_web_plugins' resolve error on web

  # UI / Charts
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
